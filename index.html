<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VizMaker Node Prompt Studio Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Abar';
    src: url('fonts/AbarHigh-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Abar';
    src: url('fonts/AbarHigh-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Abar';
    src: url('fonts/AbarHigh-Bold.ttf') format('truetype');
    font-weight: 700;
  }

  :root {
    --bg-dark: #07080c;
    --bg-node: #11131c;
    --bg-node-header: #161a29;
    --border-node: #252a3d;
    --border-node-active: #6366f1;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.45);
    --accent-cyan: #06b6d4;
    --accent-emerald: #10b981;
    --accent-banana: #fbbf24;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --font-en: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-fa: 'Abar Mid', 'Abar High', 'Abar', system-ui, -apple-system, Tahoma, sans-serif;
  }

  [lang="en"] {
    direction: ltr !important;
  }
  [lang="en"] body {
    font-family: var(--font-en) !important;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-primary);
    font-family: var(--font-fa);
    font-size: 13.5px;
    line-height: 1.5;
    overflow-x: hidden;
    padding-bottom: 280px;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 60%),
      radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 100% 100%, 28px 28px;
    min-height: 100vh;
  }

  /* Clean Recording Mode (ESC / C) */
  body.clean-recording-mode header,
  body.clean-recording-mode .mode-bar,
  body.clean-recording-mode .prompt-dock,
  body.clean-recording-mode .engine-options-strip {
    display: none !important;
  }
  body.clean-recording-mode {
    padding-bottom: 20px !important;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(7, 8, 12, 0.94);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-node);
    padding: 10px 24px;
  }

  .header-container {
    max-width: 1700px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: var(--font-en);
    color: #fff;
    box-shadow: 0 0 16px var(--accent-glow);
  }

  .brand-title {
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-en);
    color: #fff;
  }

  .brand-subtitle {
    font-size: 11px;
    color: var(--accent-cyan);
    font-weight: 600;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .lang-btn {
    padding: 6px 14px;
    border-radius: 20px;
    background: #141724;
    border: 1px solid var(--border-node);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .lang-btn:hover {
    border-color: var(--accent);
    background: #1c2033;
  }

  .rec-hint {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-en);
    padding: 4px 8px;
    border-radius: 6px;
    background: #10121a;
    border: 1px solid var(--border-node);
  }

  /* Mode Bar */
  .mode-bar {
    background: #0d0f17;
    border-bottom: 1px solid var(--border-node);
    padding: 8px 24px;
  }

  .mode-bar-inner {
    max-width: 1700px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .mode-tabs {
    display: flex;
    gap: 8px;
  }

  .mode-pill {
    padding: 8px 18px;
    border-radius: 10px;
    background: #141622;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mode-pill:hover {
    color: #fff;
    background: #1b1f30;
  }
  .mode-pill.active {
    background: #1e2238;
    border-color: var(--border-node-active);
    color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .archetype-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #12141f;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border-node);
  }

  .archetype-btn {
    padding: 6px 14px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .archetype-btn:hover {
    color: #fff;
    background: #1a1e2e;
  }
  .archetype-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* Node Graph Container */
  .graph-wrapper {
    position: relative;
    max-width: 1700px;
    margin: 20px auto;
    padding: 16px 24px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-node) transparent;
  }
  .graph-wrapper::-webkit-scrollbar {
    height: 8px;
  }
  .graph-wrapper::-webkit-scrollbar-thumb {
    background: var(--border-node);
    border-radius: 4px;
  }

  /* SVG Connections Layer */
  .connections-svg {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
  }

  .connection-wire {
    fill: none;
    stroke: url(#wireGradient);
    stroke-width: 3.5px;
    stroke-linecap: round;
    stroke-dasharray: 8, 5;
    animation: flowWire 2.2s linear infinite;
    filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.65));
  }

  @keyframes flowWire {
    from { stroke-dashoffset: 52; }
    to { stroke-dashoffset: 0; }
  }

  /* Nodes Flow Container */
  .nodes-flow {
    display: flex;
    flex-wrap: wrap;
    gap: 36px;
    position: relative;
    z-index: 2;
    padding: 10px 0 20px 0;
  }

  /* Single Node Component */
  .node-box {
    width: 260px;
    background: var(--bg-node);
    border: 1px solid var(--border-node);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: all 0.22s ease;
  }

  .node-box:hover {
    border-color: #404868;
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
  }

  .node-box.configured {
    border-color: rgba(99, 102, 241, 0.7);
  }

  .node-header {
    background: var(--bg-node-header);
    border-bottom: 1px solid var(--border-node);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 13px 13px 0 0;
  }

  .node-title-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .node-icon {
    font-size: 16px;
  }

  .node-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
  }

  .node-badge {
    font-size: 10px;
    font-weight: 600;
    font-family: var(--font-en);
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent-cyan);
    padding: 2px 7px;
    border-radius: 6px;
    border: 1px solid rgba(6, 182, 212, 0.2);
  }

  /* Node Connection Sockets (Pins) */
  .node-pin-in, .node-pin-out {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #1e2235;
    border: 2px solid var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    z-index: 5;
  }
  .node-pin-in { left: -7px; }
  .node-pin-out { right: -7px; }

  [dir="rtl"] .node-pin-in { left: auto; right: -7px; }
  [dir="rtl"] .node-pin-out { right: auto; left: -7px; }

  /* Node Body Content */
  .node-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .node-media-preview {
    width: 100%;
    height: 140px;
    border-radius: 10px;
    background: radial-gradient(circle at 50% 35%, #384266 0%, #161a29 100%);
    overflow: hidden;
    position: relative;
    border: 1px solid #2d3654;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .node-media-preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.9)) contrast(1.2) brightness(1.35);
    transition: transform 0.3s ease;
  }

  .node-multi-count-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(99, 102, 241, 0.9);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  [dir="rtl"] .node-multi-count-badge {
    right: auto;
    left: 8px;
  }

  /* Multi-select chips list inside node */
  .node-chips-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 70px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .node-chip-item {
    background: #181c2d;
    border: 1px solid var(--border-node);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .node-chip-remove {
    cursor: pointer;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1;
  }
  .node-chip-remove:hover { color: #f87171; }

  .node-val-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-val-prompt {
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-en);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .node-choose-btn {
    padding: 8px 12px;
    border-radius: 8px;
    background: #181b28;
    border: 1px solid var(--border-node);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 4px;
  }
  .node-choose-btn:hover {
    background: #23273c;
    border-color: var(--accent);
    color: var(--accent-cyan);
  }

  /* Option Selection Modal Drawer (With Multi-Select Support) */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-window {
    width: 100%;
    max-width: 1100px;
    max-height: 85vh;
    background: #10121b;
    border: 1px solid var(--border-node-active);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: modalPop 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }

  .modal-header {
    background: #141724;
    border-bottom: 1px solid var(--border-node);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .modal-title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }

  .modal-counter {
    background: rgba(99, 102, 241, 0.2);
    color: var(--accent-cyan);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }

  .modal-search {
    flex: 1;
    max-width: 320px;
    padding: 8px 14px;
    border-radius: 8px;
    background: #0b0c13;
    border: 1px solid var(--border-node);
    color: #fff;
    font-size: 13px;
    outline: none;
    user-select: text;
  }

  .modal-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .modal-apply-btn {
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-apply-btn:hover {
    background: #4f46e5;
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close-btn:hover { color: #f87171; }

  .modal-grid {
    padding: 24px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 16px;
  }

  /* Modal Cards with Checkmark Indicator */
  .modal-card {
    background: #141724;
    border: 1px solid var(--border-node);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .modal-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    background: #1a1e2f;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .modal-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
    background: #20253d;
  }

  .modal-card-checkbox {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(14, 17, 27, 0.8);
    border: 1px solid var(--border-node);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    z-index: 5;
  }
  [dir="rtl"] .modal-card-checkbox {
    right: auto;
    left: 8px;
  }

  .modal-card.selected .modal-card-checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-card-media {
    width: 100%;
    height: 135px;
    background: radial-gradient(circle at 50% 35%, #2a3350 0%, #0d0f17 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .modal-card-media img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7)) contrast(1.15) brightness(1.25);
  }

  .modal-card-info {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .modal-card-title {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
  }

  .modal-card-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.35;
  }

  /* Live Master Prompt Dock */
  .prompt-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(8, 9, 14, 0.96);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-node);
    padding: 12px 24px;
    z-index: 100;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.7);
  }

  .dock-container {
    max-width: 1700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dock-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Target Engine Selector */
  .engine-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #12141f;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border-node);
  }

  .engine-btn {
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    border: none;
    color: var(--text-muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .engine-btn:hover {
    color: #fff;
    background: #191c2b;
  }
  .engine-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .engine-btn.banana.active {
    background: #d97706;
    color: #fff;
    box-shadow: 0 0 12px rgba(217, 119, 6, 0.4);
  }

  /* Engine Specific Parameters Sub-bar */
  .engine-options-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: rgba(18, 20, 31, 0.8);
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #1c2033;
  }

  .engine-opt-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .engine-opt-btn {
    padding: 3px 8px;
    border-radius: 5px;
    background: #151825;
    border: 1px solid var(--border-node);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .engine-opt-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Prompt Tabs */
  .prompt-tab-group {
    display: flex;
    gap: 6px;
  }

  .prompt-tab-btn {
    padding: 5px 14px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    background: #12141f;
    color: var(--text-muted);
  }
  .prompt-tab-btn.active {
    background: #1a1e2f;
    border-color: var(--border-node-active);
    color: #fff;
  }

  .dock-main-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .prompt-textarea {
    flex: 1;
    background: #0f111a;
    border: 1px solid var(--border-node);
    border-radius: 10px;
    padding: 10px 14px;
    color: #fff;
    font-family: var(--font-en);
    font-size: 13.5px;
    resize: none;
    height: 72px;
    outline: none;
    line-height: 1.45;
    user-select: text;
    direction: ltr;
    text-align: left;
  }
  .prompt-textarea.fa-text {
    direction: rtl;
    text-align: right;
    font-family: var(--font-fa);
  }

  .dock-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 140px;
  }

  .copy-btn {
    flex: 1;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .copy-btn:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }

  .clear-btn {
    padding: 6px;
    background: #141724;
    border: 1px solid var(--border-node);
    color: #f87171;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;

function t(word) {
  if (state.lang === 'fa') {
    return FA_DICT[word] || word;
  }
  return word;
}

// Initialize Application
function init() {
  bindEvents();
  initDefaults();
  renderNodes();
  updateWires();
  renderEngineStrip();
  updateMasterPrompt();
  applyLanguage();
  window.addEventListener('resize', updateWires);
}

function initDefaults() {
  const pipeline = getCurrentPipeline();
  pipeline.forEach(nodeDef => {
    const options = getNodeOptions(nodeDef);
    if (options.length > 0 && (!state.nodeSelections[nodeDef.key] || state.nodeSelections[nodeDef.key].length === 0)) {
      state.nodeSelections[nodeDef.key] = [options[0]];
    }
  });
}

function getCurrentPipeline() {
  if (state.mode === 'image_creator') {
    return nodePipelines.image_creator[state.archetype] || [];
  }
  return nodePipelines[state.mode] || [];
}

function getNodeOptions(nodeDef) {
  if (nodeDef.isPresetGroup) {
    const list = [];
    nodeDef.filterNames.forEach(name => {
      const p = ALL_PRESETS.find(x => x.Name === name);
      if (p) {
        list.push({
          id: p.Id,
          titleEn: p.Name,
          titleFa: t(p.Name),
          prompt: p.Content,
          iconUrl: p.ThumbnailUrl,
          catEn: nodeDef.titleEn,
          catFa: nodeDef.titleFa
        });
      }
    });
    return list;
  }

  const p = ALL_PRESETS.find(x => x.Name === nodeDef.presetName);
  if (!p || !p.Parameters) return [];

  const param = p.Parameters.find(x => x.Key.toLowerCase() === nodeDef.paramKey.toLowerCase());
  if (!param || !param.IconItems) return [];

  return param.IconItems.map(it => {
    const raw = it.Name || it.Prompt;
    return {
      id: `${nodeDef.key}__${raw}`,
      titleEn: raw,
      titleFa: t(raw),
      prompt: it.Prompt,
      iconUrl: it.IconUrl,
      catEn: nodeDef.titleEn,
      catFa: nodeDef.titleFa
    };
  });
}

function bindEvents() {
  // Mode tabs
  document.querySelectorAll('.mode-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      document.getElementById('archetypeSelector').style.display = state.mode === 'image_creator' ? 'flex' : 'none';
      initDefaults();
      renderNodes();
      updateWires();
      renderEngineStrip();
      updateMasterPrompt();
    });
  });

  // Archetype buttons
  document.querySelectorAll('.archetype-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.archetype-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.archetype = btn.dataset.archetype;
      initDefaults();
      renderNodes();
      updateWires();
      updateMasterPrompt();
    });
  });

  // Target Engine buttons
  document.querySelectorAll('.engine-btn[data-engine]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.engine-btn[data-engine]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.targetEngine = btn.dataset.engine;
      renderEngineStrip();
      updateMasterPrompt();
    });
  });

  // Aspect ratio buttons
  document.querySelectorAll('.ar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ar-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.aspectRatio = btn.dataset.ar;
      updateMasterPrompt();
    });
  });

  // Language toggle
  document.getElementById('langToggleBtn').addEventListener('click', () => {
    state.lang = state.lang === 'fa' ? 'en' : 'fa';
    applyLanguage();
    renderNodes();
    updateWires();
    renderEngineStrip();
    updateMasterPrompt();
  });

  // Prompt View Tabs (English / Persian)
  document.getElementById('tabEnPrompt').addEventListener('click', () => {
    state.promptView = 'en';
    document.getElementById('tabEnPrompt').classList.add('active');
    document.getElementById('tabFaPrompt').classList.remove('active');
    updateMasterPrompt();
  });

  document.getElementById('tabFaPrompt').addEventListener('click', () => {
    state.promptView = 'fa';
    document.getElementById('tabFaPrompt').classList.add('active');
    document.getElementById('tabEnPrompt').classList.remove('active');
    updateMasterPrompt();
  });

  // Copy button
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('promptBox').value;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      showToast(state.lang === 'fa' ? 'پرامپت با موفقیت کپی شد! 📋✨' : 'Prompt copied to clipboard! 📋✨');
    });
  });

  // Clear button
  document.getElementById('clearBtn').addEventListener('click', () => {
    state.nodeSelections = {};
    initDefaults();
    renderNodes();
    updateWires();
    updateMasterPrompt();
    showToast(state.lang === 'fa' ? 'تنظیمات نودها به حالت اولیه بازگشت.' : 'Nodes reset to default.');
  });

  // Modal Apply button
  document.getElementById('modalApplyBtn').addEventListener('click', () => {
    if (state.activeModalNode) {
      state.nodeSelections[state.activeModalNode.key] = [...state.tempModalSelections];
      closeModal();
      renderNodes();
      updateWires();
      updateMasterPrompt();
    }
  });

  // Modal close
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // Modal search
  document.getElementById('modalSearch').addEventListener('input', (e) => {
    renderModalCards(e.target.value.trim().toLowerCase());
  });

  // ESC / C for Clean Recording Mode
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.getElementById('modalOverlay').classList.contains('open')) {
        closeModal();
      } else {
        document.body.classList.toggle('clean-recording-mode');
      }
    } else if ((e.key === 'c' || e.key === 'C') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      document.body.classList.toggle('clean-recording-mode');
    }
  });
}

function renderNodes() {
  const container = document.getElementById('nodesFlow');

  pipeline.forEach((nodeDef, index) => {
    const nodeEl = document.createElement('div');
    nodeEl.className = 'node-box configured';
    nodeEl.id = `node_${nodeDef.key}`;

    const selectedList = state.nodeSelections[nodeDef.key] || [];
    const count = selectedList.length;

    const nodeTitle = state.lang === 'fa' ? nodeDef.titleFa : nodeDef.titleEn;
    const badgeText = count > 1 ? (state.lang === 'fa' ? `${count} انتخاب` : `${count} items`) : `N0${index + 1}`;

    const firstItem = selectedList[0];
    const imgSrc = (firstItem && firstItem.iconUrl) ? firstItem.iconUrl : 'https://via.placeholder.com/300x180/11131c/6366f1?text=Option';

    let contentHtml = '';
    if (count === 0) {
      contentHtml = `<div class="node-val-name" style="color: var(--text-muted);">${state.lang === 'fa' ? 'هیچ گزینه ای انتخاب نشده' : 'No option selected'}</div>`;
    } else if (count === 1) {
      const valTitle = state.lang === 'fa' ? firstItem.titleFa : firstItem.titleEn;
      contentHtml = `
        <div class="node-val-name">${valTitle}</div>
        <div class="node-val-prompt">${firstItem.prompt}</div>
      `;
    } else {
      // Multiple items selected! Show chips list inside node!
      const chipsHtml = selectedList.map(it => {
        const title = state.lang === 'fa' ? it.titleFa : it.titleEn;
        return `
          <span class="node-chip-item">
            <span>${title}</span>
            <span class="node-chip-remove" data-key="${nodeDef.key}" data-id="${it.id}">&times;</span>
          </span>
        `;
      }).join('');
      contentHtml = `<div class="node-chips-list">${chipsHtml}</div>`;
    }

    nodeEl.innerHTML = `
      ${index > 0 ? '<div class="node-pin-in"></div>' : ''}
      <div class="node-header">
        <div class="node-title-group">
          <span class="node-icon">${nodeDef.icon}</span>
          <span class="node-title">${nodeTitle}</span>
        </div>
        <span class="node-badge">${badgeText}</span>
      </div>
      <div class="node-body">
        <div class="node-media-preview">
          <img src="${imgSrc}" alt="${nodeTitle}" loading="lazy">
          ${count > 1 ? `<span class="node-multi-count-badge">+${count - 1}</span>` : ''}
        </div>
        <div>
          ${contentHtml}
        </div>
        <button class="node-choose-btn" data-key="${nodeDef.key}">
          ⚙️ <span>${state.lang === 'fa' ? (nodeDef.multi ? 'انتخاب و افزودن' : 'انتخاب و تغییر') : (nodeDef.multi ? 'Select Multiple' : 'Select Option')}</span>
        </button>
      </div>
      ${index < pipeline.length - 1 ? '<div class="node-pin-out"></div>' : ''}
    `;

    // Handle removing chip
    nodeEl.querySelectorAll('.node-chip-remove').forEach(rmBtn => {
      rmBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rmId = rmBtn.dataset.id;
        state.nodeSelections[nodeDef.key] = state.nodeSelections[nodeDef.key].filter(x => x.id !== rmId);
        renderNodes();
        updateWires();
        updateMasterPrompt();
      });
    });

    // Handle open modal
    nodeEl.querySelector('.node-choose-btn').addEventListener('click', () => {
      openModalForNode(nodeDef);
    });

    container.appendChild(nodeEl);
  });
}

function updateWires() {
  const container = document.getElementById('nodesFlow');
  const svg = document.getElementById('connectionsSvg');
  if (!container || !svg) return;

  const wrapRect = document.querySelector('.graph-wrapper').getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width);
  svg.setAttribute('height', wrapRect.height);
  svg.style.width = wrapRect.width + 'px';
  svg.style.height = wrapRect.height + 'px';

  svg.innerHTML = `
    <defs>
      <linearGradient id="wireGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
    </defs>
  `;

  const pipeline = getCurrentPipeline();
  const isRtl = document.documentElement.dir === 'rtl';

  for (let i = 0; i < pipeline.length - 1; i++) {
    const nodeA = document.getElementById(`node_${pipeline[i].key}`);
    const nodeB = document.getElementById(`node_${pipeline[i + 1].key}`);
    if (!nodeA || !nodeB) continue;

    const rA = nodeA.getBoundingClientRect();
    const rB = nodeB.getBoundingClientRect();

    // Out pin of nodeA
    const x1 = isRtl ? (rA.left - wrapRect.left) : (rA.right - wrapRect.left);
    const y1 = (rA.top + rA.height / 2) - wrapRect.top;

    // In pin of nodeB
    const x2 = isRtl ? (rB.right - wrapRect.left) : (rB.left - wrapRect.left);
    const y2 = (rB.top + rB.height / 2) - wrapRect.top;

    let pathData = '';
    if (Math.abs(y2 - y1) < 40) {
      // Same row: hanging cable catenary curve!
      const sag = 45;
      pathData = isRtl
        ? `M ${x1} ${y1} C ${x1 - 25} ${y1 + sag}, ${x2 + 25} ${y2 + sag}, ${x2} ${y2}`
        : `M ${x1} ${y1} C ${x1 + 25} ${y1 + sag}, ${x2 - 25} ${y2 + sag}, ${x2} ${y2}`;
    } else {
      // Wrapped to next row: loop around smoothly
      const midY = (y1 + y2) / 2;
      if (isRtl) {
        pathData = `M ${x1} ${y1} C ${x1 - 60} ${y1 + 40}, ${x1 - 60} ${midY}, ${(x1 + x2) / 2} ${midY} C ${x2 + 60} ${midY}, ${x2 + 60} ${y2 - 40}, ${x2} ${y2}`;
      } else {
        pathData = `M ${x1} ${y1} C ${x1 + 60} ${y1 + 40}, ${x1 + 60} ${midY}, ${(x1 + x2) / 2} ${midY} C ${x2 - 60} ${midY}, ${x2 - 60} ${y2 - 40}, ${x2} ${y2}`;
      }
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathData);
    path.setAttribute('class', 'connection-wire');
    svg.appendChild(path);
  }
}

// Modal handling with Multi-Select support
function openModalForNode(nodeDef) {
  state.activeModalNode = nodeDef;
  const currentSelections = state.nodeSelections[nodeDef.key] || [];
  state.tempModalSelections = [...currentSelections];

  document.getElementById('modalTitle').textContent = state.lang === 'fa' ? `انتخاب ${nodeDef.titleFa}` : `Select ${nodeDef.titleEn}`;
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalOverlay').classList.add('open');
  updateModalCounter();
  renderModalCards();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  state.activeModalNode = null;
  state.tempModalSelections = [];
}

function updateModalCounter() {
  const count = state.tempModalSelections.length;
  const counterEl = document.getElementById('modalCounter');
  counterEl.textContent = state.lang === 'fa' ? `${count} مورد انتخاب شده` : `${count} items selected`;
}

function renderModalCards(query = '') {
  const grid = document.getElementById('modalGrid');
  grid.innerHTML = '';

  if (!state.activeModalNode) return;

  const options = getNodeOptions(state.activeModalNode);
  const isMulti = state.activeModalNode.multi;

  let filtered = options;
  if (query) {
    filtered = filtered.filter(opt => {
      return opt.titleEn.toLowerCase().includes(query) ||
             opt.titleFa.toLowerCase().includes(query) ||
             opt.prompt.toLowerCase().includes(query);
    });
  }

  filtered.forEach(opt => {
    const isSelected = state.tempModalSelections.some(x => x.id === opt.id);
    const card = document.createElement('div');
    card.className = `modal-card ${isSelected ? 'selected' : ''}`;

    const title = state.lang === 'fa' ? opt.titleFa : opt.titleEn;
    const desc = state.lang === 'fa' ? opt.titleEn : opt.prompt;

    card.innerHTML = `
      <div class="modal-card-checkbox">${isSelected ? '✓' : ''}</div>
      <div class="modal-card-media">
        <img src="${opt.iconUrl}" alt="${title}" loading="lazy">
      </div>
      <div class="modal-card-info">
        <div class="modal-card-title">${title}</div>
        <div class="modal-card-desc">${desc}</div>
      </div>
    `;

    card.addEventListener('click', () => {
      if (isMulti) {
        // Toggle selection
        if (state.tempModalSelections.some(x => x.id === opt.id)) {
          state.tempModalSelections = state.tempModalSelections.filter(x => x.id !== opt.id);
        } else {
          state.tempModalSelections.push(opt);
        }
        updateModalCounter();
        renderModalCards(query);
      } else {
        // Single select: choose and apply immediately
        state.tempModalSelections = [opt];
        state.nodeSelections[state.activeModalNode.key] = [opt];
        closeModal();
        renderNodes();
        updateWires();
        updateMasterPrompt();
      }
    });

    grid.appendChild(card);
  });
}

// Prompt Synthesis (English & Rich Persian Translation)
function updateMasterPrompt() {
  const pipeline = getCurrentPipeline();
  const nodeData = {};

  pipeline.forEach(nd => {
    const list = state.nodeSelections[nd.key] || [];
    nodeData[nd.key] = list;
  });

  // Helpers to join items
  const getEn = (k) => (nodeData[k] || []).map(x => x.prompt).join(', ');
  const getFa = (k) => (nodeData[k] || []).map(x => x.titleFa).join('، ');

  let enPrompt = '';
  let faPrompt = '';

  if (state.mode === 'image_creator') {
    if (state.archetype === 'car') {
      const cTypeEn = getEn('car_type') || 'supercar';
      const cTypeFa = getFa('car_type') || 'سوپرکار مسابقه ای';

      const cDesignEn = getEn('car_design') || 'futuristic';
      const cDesignFa = getFa('car_design') || 'آینده نگرانه';

      const cPropEn = getEn('car_proportions') || 'low and elongated';
      const cPropFa = getFa('car_proportions') || 'کم ارتفاع و کشیده';

      const cGeomEn = getEn('car_geometry') || 'streamlined aerodynamic';
      const cGeomFa = getFa('car_geometry') || 'صیقلی و آیرودینامیک';

      const cPresEn = getEn('car_presentation') || 'photorealistic studio render';
      const cPresFa = getFa('car_presentation') || 'رندر آتلیه ای تاریک فوتورئالیستیک';

      const cLightEn = getEn('lighting') || 'golden hour';
      const cLightFa = getFa('lighting') || 'ساعت طلایی عصر';

      const cCamEn = getEn('camera') || 'ARRI ALEXA 35';
      const cCamFa = getFa('camera') || 'آری الکسا ۳۵ (استاندارد طلایی هالیوود)';

      enPrompt = `A high-end concept ${cTypeEn} showcasing a ${cDesignEn} design language, featuring ${cPropEn} proportions with ${cGeomEn} bodywork. Presented as a ${cPresEn}. Captured during ${cLightEn} with clean specular reflections. Cinematography: Shot on ${cCamEn}, 24mm cinema prime lens, f/2.8 shallow depth of field.`;

      faPrompt = `یک ${cTypeFa} کانسپت رده بالا با زبان طراحی ${cDesignFa}، دارای تناسبات بدنه ${cPropFa} و فرم هندسی ${cGeomFa}. ارائه به صورت ${cPresFa} با کیفیت بالا. نورپردازی در ${cLightFa} همراه با بازتاب های شارپ روی خطوط شانه خودرو. پکیج فیلمبرداری سینمایی با ${cCamFa}، لنز ۲۴ میلی متری پرایم، دیافراگم اف ۲.۸ با بوکه طبیعی پس زمینه. نسبت کادر: ${state.aspectRatio}.`;
    } else if (state.archetype === 'arch') {
      const aTypeEn = getEn('arch_type') || 'Villa';
      const aTypeFa = getFa('arch_type') || 'ویلا';

      const aStyleEn = getEn('arch_style') || 'Contemporary';
      const aStyleFa = getFa('arch_style') || 'معاصر';

      const aMassEn = getEn('arch_massing') || 'cantilevered hovering volumes';
      const aMassFa = getFa('arch_massing') || 'احجام پله ای متوالی';

      const aMatEn = getEn('arch_materials') || 'Concrete and Glass';
      const aMatFa = getFa('arch_materials') || 'بتن اکسپوز و شیشه شفاف';

      const aRoofEn = getEn('arch_roof') || 'flat roof';
      const aRoofFa = getFa('arch_roof') || 'بام مسطح مدرن';

      const aSigEn = getEn('arch_signature') || 'atrium';
      const aSigFa = getFa('arch_signature') || 'آتریوم مرکزی نورگیر';

      const aLocEn = getEn('arch_location') || 'coastal waterfront';
      const aLocFa = getFa('arch_location') || 'کرانه ساحلی رو به آب';

      const aLightEn = getEn('lighting') || 'golden hour';
      const aLightFa = getFa('lighting') || 'ساعت طلایی غروب';

      const aCamEn = getEn('camera') || 'ARRI ALEXA 35';
      const aCamFa = getFa('camera') || 'آری الکسا ۳۵ (استاندارد طلایی هالیوود)';

      enPrompt = `An original architectural design of a ${aTypeEn} in ${aStyleEn} style. Sculptural massing composed of ${aMassEn}. Built with ${aMatEn}, featuring a ${aRoofEn} and iconic ${aSigEn}. Situated in a ${aLocEn} context. Atmospheric lighting during ${aLightEn}. Photorealistic cinematography: Shot on ${aCamEn}, 24mm wide-angle lens, f/8 crisp architectural focus.`;

      faPrompt = `طراحی اصیل معماری یک بنای ${aTypeFa} با سبک معماری ${aStyleFa}. ترکیب بندی حجم سازی به صورت ${aMassFa}. ساختار و متریال اصلی از جنس ${aMatFa} همراه با ${aRoofFa} و المان شاخص ${aSigFa}. مستقر در بستر مکانی ${aLocFa}. شرایط نوری و اتمسفر در ${aLightFa}. فیلمبرداری سینمایی با ${aCamFa} و لنز ۲۴ میلی متری واید معماری با شارپنس کامل خطوط و متریال. کادر: ${state.aspectRatio}.`;
    } else if (state.archetype === 'avatar') {
      const gEn = getEn('av_gender') || 'person';
      const gFa = getFa('av_gender') || 'شخصیت';

      const hEn = getEn('av_hair_style') || 'styled hair';
      const hFa = getFa('av_hair_style') || 'مرتب';

      const emEn = getEn('av_emotion') || 'confident smile';
      const emFa = getFa('av_emotion') || 'لبخند ملایم';

      const outEn = getEn('av_outfit') || 'creative fashion outfit';
      const outFa = getFa('av_outfit') || 'مد و لباس شیک';

      const envEn = getEn('av_environment') || 'urban street';
      const envFa = getFa('av_environment') || 'خیابان مدرن شهری';

      const camEn = getEn('camera') || 'ARRI ALEXA 35';
      const camFa = getFa('camera') || 'آری الکسا ۳۵';

      enPrompt = `A photorealistic cinematic portrait of a ${gEn} with ${hEn}, expressing a ${emEn}. Dressed in ${outEn}, situated in an ${envEn} environment. Shot on ${camEn}, 85mm portrait lens, f/1.4 shallow depth of field.`;

      faPrompt = `یک پرتره سینمایی فوتورئالیستیک از یک ${gFa} با مدل موی ${hFa} و حالت چهره با ${emFa}. با استایل پوشش ${outFa}، مستقر در محیط ${envFa}. تصویربرداری با ${camFa}، لنز ۸۵ میلی متری پرتره با عمق میدان باریک و بوکه رویایی پس زمینه. نسبت تصویر: ${state.aspectRatio}.`;
    }
  } else if (state.mode === 'image_editor') {
    // Multi-select combinations for Inpainting & Restyling!
    const addEn = getEn('edit_add');
    const addFa = getFa('edit_add');

    const natEn = getEn('edit_nature');
    const natFa = getFa('edit_nature');

    const restEn = getEn('edit_restyle') || 'photorealistic architectural enhancement';
    const restFa = getFa('edit_restyle') || 'بهبود و بازآفرینی فوتورئالیستیک';

    const lightEn = getEn('lighting');
    const lightFa = getFa('lighting');

    let editPartsEn = [];
    let editPartsFa = [];

    if (addEn) {
      editPartsEn.push(`seamlessly insert elements (${addEn})`);
      editPartsFa.push(`افزودن یکپارچه المان ها (${addFa})`);
    }
    if (natEn) {
      editPartsEn.push(`add natural vegetation and greenery (${natEn})`);
      editPartsFa.push(`افزودن پوشش گیاهی و درختان (${natFa})`);
    }
    if (restEn) {
      editPartsEn.push(`apply visual style transfer: ${restEn}`);
      editPartsFa.push(`تبدیل استایل بصری: ${restFa}`);
    }
    if (lightEn) {
      editPartsEn.push(`adjust environmental lighting to ${lightEn}`);
      editPartsFa.push(`تنظیم نورپردازی محیط به حالت ${lightFa}`);
    }

    enPrompt = `Architectural image edit and enhancement: ${editPartsEn.join(', ')}. Maintain strict perspective alignment, correct cast shadows, and realistic scale.`;
    faPrompt = `دستور جامع ویرایش و اصلاح تصویر: ${editPartsFa.join('؛ ')}. حفظ دقیق زاویه پرسپکتیو، تطابق کامل سایه ها و مقیاس طبیعی سوژه ها در صحنه. نسبت کادر: ${state.aspectRatio}.`;
  } else if (state.mode === 'video_creator') {
    // Video Creator with Unified Camera Movements
    const movesEn = getEn('vid_camera_movements') || 'cinematic dolly in';
    const movesFa = getFa('vid_camera_movements') || 'حرکت دالی به جلو';

    const dynamicsEn = getEn('vid_dynamics');
    const dynamicsFa = getFa('vid_dynamics');

    const camEn = getEn('camera') || 'ARRI ALEXA 35';
    const camFa = getFa('camera') || 'آری الکسا ۳۵';

    let videoPartsEn = [`camera movement: ${movesEn}`];
    let videoPartsFa = [`حرکت و شات دوربین: ${movesFa}`];

    if (dynamicsEn) {
      videoPartsEn.push(`scene timing and dynamics: ${dynamicsEn}`);
      videoPartsFa.push(`پویایی صحنه و گذر زمان: ${dynamicsFa}`);
    }

    videoPartsEn.push(`captured on ${camEn}, smooth 24fps motion blur, steady-cam fluid sequence`);
    videoPartsFa.push(`فیلمبرداری با ${camFa}، موشن بلور استاندارد ۲۴ فریم در ثانیه و تعادل کامل بدون لرزش`);

    enPrompt = `Cinematic video render with physical camera choreography: ${videoPartsEn.join(' -- ')}.`;
    faPrompt = `رندر ویدیویی سینمایی با طراحی حرکات دوربین: ${videoPartsFa.join(' -- ')}. کادر ویدیویی: ${state.aspectRatio}.`;
  }

  // Format tailored for Target AI Engine (including Nano Banana Pro / Google Flow logic!)
  const rawBaseEn = enPrompt;
  const rawBaseFa = faPrompt;

  if (state.targetEngine === 'nano_banana') {
    const flowAspect = state.aspectRatio === '16:9' ? 'landscape' : (state.aspectRatio === '9:16' ? 'portrait' : 'square');
    if (state.flowSyntaxMode === 'cli') {
      enPrompt = `flow image "${rawBaseEn}" --model ${state.flowModel} --aspect ${flowAspect}`;
      faPrompt = `[دستور خط فرمان Google Flow CLI]:\nflow image "${rawBaseEn}" --model ${state.flowModel} --aspect ${flowAspect}\n\n[شرح فارسی پارامترها]:\n${rawBaseFa}\n• مدل انتخابی: ${state.flowModel === 'gem_pix_2' ? 'نانوبنانا پرو (gem_pix_2)' : 'نانوبنانا استاندارد (narwhal)'}\n• کادر تصویر: ${flowAspect} (${state.aspectRatio})`;
    } else {
      enPrompt = `[Google Flow / Nano Banana Pro]: ${rawBaseEn} --model ${state.flowModel} --aspect ${flowAspect} --depth_enhance true --photoreal_detail high`;
      faPrompt = `[فرمت بهینه سازی شده نانوبنانا پرو / گوگل فلو]:\n${rawBaseFa}\n• مدل پردازش: ${state.flowModel === 'gem_pix_2' ? 'Nano Banana Pro (کیفیت بالا)' : 'Nano Banana 2 (استاندارد)'}\n• نسبت کادر: ${flowAspect} (${state.aspectRatio})\n• بهینه سازی شده برای هدایت نور حجمی، رندرهای معماری و بافت های بازتابی دقیق.`;
    }
  } else if (state.targetEngine === 'midjourney') {
    enPrompt = `${rawBaseEn.replace(/\n+/g, ' ')} --ar ${state.aspectRatio} --v 6.1 --style raw --c 2`;
  } else if (state.targetEngine === 'flux') {
    enPrompt = `Masterpiece, 8k ultra photorealistic render, ${rawBaseEn} [Aspect: ${state.aspectRatio}, Steps: 28, CFG: 3.5]`;
  } else if (state.targetEngine === 'kling') {
    enPrompt = `Cinematic video render, fluid physics motion: ${rawBaseEn} --motion 6 --duration 5s --ar ${state.aspectRatio}`;
  } else {
    enPrompt = `${rawBaseEn} [Aspect: ${state.aspectRatio}]`;
  }

  const box = document.getElementById('promptBox');
  if (state.promptView === 'en') {
    box.value = enPrompt;
    box.classList.remove('fa-text');
  } else {
    box.value = faPrompt;
    box.classList.add('fa-text');
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
